<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 449.1 775" width="449.1" height="775" role="img" aria-labelledby="t d">
<title id="t">Three layers, one record</title>
<desc id="d">Four plates. The same field sits at the same place on the personal, agency and canonical plates, joined by a thread; on the fourth plate the three become one stack, each value attributed. A line from a personal note down towards the agency layer ends in a refusal mark.</desc>
