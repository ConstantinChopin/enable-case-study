<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 483.7 675" width="483.7" height="675" role="img" aria-labelledby="t d">
<title id="t">The landscape</title>
<desc id="d">Three plates. The top one carries four tools in a row, a trip handed from one to the next. The middle one carries five separate towers of records, each on its own footprint, nothing joining them. The bottom one is empty: a dashed outline where the tools would meet.</desc>
