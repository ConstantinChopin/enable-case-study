<text x="71" y="744" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<text x="90" y="744.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE SLICES</text>
