<circle cx="71" cy="766" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="770" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<text x="90" y="770.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE OPEN GROUND</text>
<text x="240" y="770.5" font-size="12.5" fill="#75757b">knowing the whole truth of the practice; the ground Enable took</text>
