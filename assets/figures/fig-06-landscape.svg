<text x="90" y="718.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE CROWD</text>
<text x="185" y="718.5" font-size="12.5" fill="#75757b">workflow tools, each doing one stage's work, each adding a source</text>
