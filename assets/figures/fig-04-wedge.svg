<text x="502" y="469" font-size="9.5" fill="#17171a" letter-spacing=".6" text-anchor="middle">CRM</text>
<text x="447" y="500" font-size="9.5" fill="#75757b" text-anchor="middle">read and written at every stage &#183; none holds the whole</text>

