<!-- legend -->
<circle cx="71" cy="716" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="720" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<text x="90" y="720.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE CYCLE</text>
<text x="176" y="720.5" font-size="12.5" fill="#75757b">eleven stages, lead to post-travel review, as the industry trains it</text>
<circle cx="71" cy="742" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="746" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<text x="90" y="746.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE WEDGE</text>
<text x="182" y="746.5" font-size="12.5" fill="#75757b">lead to proposal and presentation; where the knowledge work concentrates</text>
<circle cx="71" cy="768" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="772" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<text x="90" y="772.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE SOURCES</text>
<text x="200" y="772.5" font-size="12.5" fill="#75757b">the six systems at the centre; every stage reads and writes them</text>
<line x1="60" y1="792" x2="72" y2="792" stroke="#2f6fec" stroke-width="2.2" stroke-dasharray="5 4"/>
<circle cx="78" cy="792" r="5.5" fill="#ffffff" stroke="#2f6fec" stroke-width="2"/>
<text x="90" y="796" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">ANOTHER VERTICAL TOOL</text>
<text x="272" y="796" font-size="12.5" fill="#75757b">refused &#8212; downstream is crowded, and each tool adds one more source</text>
