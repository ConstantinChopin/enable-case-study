<text x="502" y="401" font-size="9.5" fill="#17171a" letter-spacing=".6" text-anchor="middle">BOOKING</text>
<rect x="345" y="418" width="94" height="26" rx="5" fill="#ffffff" stroke="#46464d" stroke-width="1.1"/>
