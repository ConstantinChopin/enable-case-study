<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 894 739" font-family="'Libre Franklin', Inter, 'Helvetica Neue', Arial, sans-serif"><rect x="0" y="0" width="894" height="900" fill="#ffffff"/>
<text x="60" y="150" font-size="13.5" font-weight="600" fill="#17171a" letter-spacing="2">FIG. 05 &#8212; THE EDITED CANON</text>
<line x1="812" y1="150" x2="829.3" y2="160" stroke="#75757b" stroke-width="1.1"/>
<text x="837.1" y="168" font-size="10" fill="#75757b" text-anchor="middle">x</text>
<line x1="812" y1="150" x2="794.7" y2="160" stroke="#75757b" stroke-width="1.1"/>
<text x="786.9" y="168" font-size="10" fill="#75757b" text-anchor="middle">y</text>
<line x1="812" y1="150" x2="812" y2="130" stroke="#75757b" stroke-width="1.1"/>
<text x="812" y="124.5" font-size="10" fill="#75757b" text-anchor="middle">z</text>

<!-- raw inventory -->
<rect x="80" y="310" width="180" height="170" rx="3" fill="#eaeae7" stroke="#46464d" stroke-width="1.4"/>
<text x="170" y="390" font-size="26" font-weight="600" fill="#17171a" text-anchor="middle">2.3M</text>
<text x="170" y="414" font-size="11" fill="#75757b" text-anchor="middle" letter-spacing=".8">PROPERTIES</text>

<!-- four filters -->
<rect x="330" y="310" width="34" height="170" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.3"/>
<text x="347" y="395" font-size="9.5" fill="#75757b" text-anchor="middle" transform="rotate(-90 347 395)" letter-spacing=".8">RANKINGS</text>
<rect x="390" y="310" width="34" height="170" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.3"/>
<text x="407" y="395" font-size="9.5" fill="#75757b" text-anchor="middle" transform="rotate(-90 407 395)" letter-spacing=".8">REVIEWS</text>
<rect x="450" y="310" width="34" height="170" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.3"/>
<text x="467" y="395" font-size="9.5" fill="#75757b" text-anchor="middle" transform="rotate(-90 467 395)" letter-spacing=".8">DESTINATION</text>
<rect x="510" y="310" width="34" height="170" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.3"/>
<text x="527" y="395" font-size="9.5" fill="#75757b" text-anchor="middle" transform="rotate(-90 527 395)" letter-spacing=".8">PRICE POINT</text>

<!-- the canon -->
<rect x="650" y="357" width="100" height="76" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.6"/>
<text x="700" y="392" font-size="17" font-weight="600" fill="#17171a" text-anchor="middle">3,000</text>
<text x="700" y="412" font-size="10" fill="#75757b" text-anchor="middle" letter-spacing=".8">RECORDS</text>

<!-- flow arrows -->
<polyline points="262,395 318,395" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polygon points="328,395 316,388.5 316,401.5" fill="#46464d"/>
<polyline points="366,395 380,395" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polyline points="426,395 440,395" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polyline points="486,395 500,395" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polyline points="546,395 638,395" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polygon points="648,395 636,388.5 636,401.5" fill="#46464d"/>

<!-- the refused move: wholesale ingestion, straight past the filters -->
<path d="M170,308 C170,232 700,232 700,296" fill="none" stroke="#2f6fec" stroke-width="2.6" stroke-dasharray="7 6"/>
<circle cx="700" cy="306" r="7.5" fill="#ffffff" stroke="#2f6fec" stroke-width="2.2"/>

<!-- callouts -->
<line x1="52" y1="296" x2="78" y2="311" stroke="#46464d" stroke-width="1"/>
<circle cx="80" cy="312" r="2.6" fill="#46464d"/>
<circle cx="46" cy="292" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="46" y="296.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<line x1="437" y1="530" x2="437" y2="484" stroke="#46464d" stroke-width="1"/>
<circle cx="437" cy="482" r="2.6" fill="#46464d"/>
<circle cx="437" cy="544" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="437" y="548.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<line x1="782" y1="452" x2="753" y2="435" stroke="#46464d" stroke-width="1"/>
<circle cx="751" cy="434" r="2.6" fill="#46464d"/>
<circle cx="788" cy="456" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="788" y="460.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>

<!-- legend -->
<circle cx="71" cy="663" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="667" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<text x="90" y="667.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">RAW INVENTORY</text>
<text x="215" y="667.5" font-size="12.5" fill="#75757b">a data partner's inventory of 2.3 million properties</text>
<circle cx="71" cy="697" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="701" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<text x="90" y="701.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">FOUR FILTERS</text>
<text x="200" y="701.5" font-size="12.5" fill="#75757b">rankings, reviews, destination, price point &#183; matched to advisor portfolios</text>
<circle cx="71" cy="731" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="735" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<text x="90" y="735.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE CANON</text>
<text x="187" y="735.5" font-size="12.5" fill="#75757b">around three thousand records advisors recognise</text>
<line x1="60" y1="765" x2="72" y2="765" stroke="#2f6fec" stroke-width="2.2" stroke-dasharray="5 4"/>
<circle cx="78" cy="765" r="5.5" fill="#ffffff" stroke="#2f6fec" stroke-width="2"/>
<text x="90" y="769" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">WHOLESALE INGESTION</text>
<text x="262" y="769" font-size="12.5" fill="#75757b">refused &#8212; volume is not coverage at the luxury end</text>
</svg>
