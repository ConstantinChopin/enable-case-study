<text x="333.9" y="258.0" font-size="13.5" font-weight="600" fill="#17171a" letter-spacing="2">FIG. 02 — THREE LAYERS, ONE RECORD</text>
<circle cx="344.9" cy="687.3" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="344.9" y="691.3" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<text x="363.9" y="691.8" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">CANONICAL</text>
<text x="453.4" y="691.8" font-size="12.5" fill="#75757b">the baseline the platform keeps</text>
<circle cx="721.4" cy="687.3" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="721.4" y="691.3" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<text x="740.4" y="691.8" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">ORGANISATION</text>
<text x="856.5" y="691.8" font-size="12.5" fill="#75757b">agency policy and agreed terms</text>
<circle cx="344.9" cy="721.3" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="344.9" y="725.3" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<text x="363.9" y="725.8" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">PERSONAL</text>
<text x="444.6" y="725.8" font-size="12.5" fill="#75757b">private notes, shared by choice</text>
<circle cx="344.9" cy="755.3" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="344.9" y="759.3" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">4</text>
<text x="363.9" y="759.8" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">EFFECTIVE VIEW</text>
<text x="497.6" y="759.8" font-size="12.5" fill="#75757b">one combined read-out, each row attributed</text>
