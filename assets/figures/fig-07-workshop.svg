<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 894 734" font-family="'Libre Franklin', Inter, 'Helvetica Neue', Arial, sans-serif">
<text x="60" y="150" font-size="13.5" font-weight="600" fill="#17171a" letter-spacing="2">FIG. 07 &#8212; THE WORKSHOP</text>
<line x1="812" y1="150" x2="829.3" y2="160" stroke="#75757b" stroke-width="1.1"/>
<text x="837.1" y="168" font-size="10" fill="#75757b" text-anchor="middle">x</text>
<line x1="812" y1="150" x2="794.7" y2="160" stroke="#75757b" stroke-width="1.1"/>
<text x="786.9" y="168" font-size="10" fill="#75757b" text-anchor="middle">y</text>
<line x1="812" y1="150" x2="812" y2="130" stroke="#75757b" stroke-width="1.1"/>
<text x="812" y="124.5" font-size="10" fill="#75757b" text-anchor="middle">z</text>

<!-- four repositories -->
<text x="68" y="232" font-size="9.5" fill="#75757b" letter-spacing=".8">FOUR REPOSITORIES</text>
<rect x="68" y="242" width="118" height="30" rx="3" fill="#eaeae7" stroke="#46464d" stroke-width="1.1"/>
<text x="127" y="261" font-size="10.5" font-weight="600" fill="#17171a" letter-spacing=".6" text-anchor="middle">PRODUCTION</text>
<rect x="194" y="242" width="66" height="30" rx="3" fill="#eaeae7" stroke="#46464d" stroke-width="1.1"/>
<text x="227" y="261" font-size="10.5" font-weight="600" fill="#17171a" letter-spacing=".6" text-anchor="middle">DEV</text>
<rect x="268" y="242" width="142" height="30" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.4"/>
<text x="339" y="261" font-size="10.5" font-weight="600" fill="#17171a" letter-spacing=".6" text-anchor="middle">DESIGN SYSTEM</text>
<rect x="418" y="242" width="118" height="30" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.4"/>
<text x="477" y="261" font-size="10.5" font-weight="600" fill="#17171a" letter-spacing=".6" text-anchor="middle">PROTOTYPE</text>

<!-- the prototype, with the system at its core -->
<rect x="252" y="356" width="330" height="200" rx="4" fill="none" stroke="#46464d" stroke-width="1.5"/>
<text x="270" y="384" font-size="11" font-weight="600" fill="#17171a" letter-spacing="1">PROTOTYPE</text>
<text x="270" y="400" font-size="10" fill="#75757b">user journeys, iterated daily</text>
<rect x="292" y="428" width="250" height="94" rx="3" fill="#fbfbfa" stroke="#46464d" stroke-width="1.5"/>
<text x="417" y="464" font-size="11.5" font-weight="600" fill="#17171a" letter-spacing="1" text-anchor="middle">DESIGN SYSTEM</text>
<text x="417" y="482" font-size="10" fill="#75757b" text-anchor="middle">atomic language &#183; Linear-inspired</text>
<text x="417" y="497" font-size="10" fill="#75757b" text-anchor="middle">embedded at the core</text>

<!-- claude code, the operator -->
<rect x="90" y="424" width="118" height="34" rx="17" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="149" y="445" font-size="10.5" font-weight="600" fill="#17171a" letter-spacing=".6" text-anchor="middle">CLAUDE CODE</text>
<polyline points="208,441 250,441" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polygon points="260,441 248,434.5 248,447.5" fill="#46464d"/>
<text x="149" y="478" font-size="10" fill="#75757b" text-anchor="middle">builds the system,</text>
<text x="149" y="492" font-size="10" fill="#75757b" text-anchor="middle">runs the iterations</text>

<!-- the loop : journeys stress the system, the system hardens -->
<path d="M 545 396 C 640 396 640 470 585 494" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polygon points="576,498 588,486 592,499" fill="#46464d"/>
<text x="668" y="428" font-size="10" fill="#75757b">journeys stress the system;</text>
<text x="668" y="442" font-size="10" fill="#75757b">limitations surface in real time,</text>
<text x="668" y="456" font-size="10" fill="#75757b">and the fix lands in the system</text>

<!-- graduation to production -->
<polyline points="417,558 417,624 240,624" fill="none" stroke="#46464d" stroke-width="2.2"/>
<polygon points="230,624 242,617.5 242,630.5" fill="#46464d"/>
<rect x="90" y="596" width="140" height="56" rx="4" fill="#eaeae7" stroke="#46464d" stroke-width="1.5"/>
<text x="160" y="620" font-size="11" font-weight="600" fill="#17171a" letter-spacing="1" text-anchor="middle">PRODUCTION</text>
<text x="160" y="637" font-size="10" fill="#75757b" text-anchor="middle">built by the engineers</text>
<text x="440" y="600" font-size="10" fill="#75757b">hardened journeys, states and components</text>
<text x="440" y="614" font-size="10" fill="#75757b">graduate; engineers implement them</text>

<!-- callouts -->
<circle cx="234" cy="342" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="234" y="346.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<line x1="243" y1="350" x2="252" y2="358" stroke="#46464d" stroke-width="1"/>
<circle cx="253" cy="359" r="2.6" fill="#46464d"/>
<circle cx="628" cy="384" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="628" y="388.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<line x1="619" y1="392" x2="606" y2="398" stroke="#46464d" stroke-width="1"/>
<circle cx="604" cy="399" r="2.6" fill="#46464d"/>
<circle cx="70" cy="580" r="12" fill="#ffffff" stroke="#46464d" stroke-width="1.4"/>
<text x="70" y="584.4" font-size="12.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<line x1="79" y1="588" x2="89" y2="596" stroke="#46464d" stroke-width="1"/>
<circle cx="90" cy="597" r="2.6" fill="#46464d"/>

<!-- legend -->
<circle cx="71" cy="706" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="710" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">1</text>
<text x="90" y="710.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE CORE</text>
<text x="176" y="710.5" font-size="12.5" fill="#75757b">the design system lives inside the prototype; every iteration runs on it</text>
<circle cx="71" cy="732" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="736" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">2</text>
<text x="90" y="736.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE LOOP</text>
<text x="176" y="736.5" font-size="12.5" fill="#75757b">journeys and system harden together; a screen that cannot be built names a missing primitive</text>
<circle cx="71" cy="758" r="11" fill="#ffffff" stroke="#46464d" stroke-width="1.3"/>
<text x="71" y="762" font-size="11.5" font-weight="600" fill="#17171a" text-anchor="middle">3</text>
<text x="90" y="762.5" font-size="13" font-weight="600" fill="#17171a" letter-spacing=".4">THE GRADUATION</text>
<text x="236" y="762.5" font-size="12.5" fill="#75757b">what survives the loop is implemented into production by the engineers</text>
</svg>
